<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - evcc Dashboard</title>
    <link rel="stylesheet" href="{{ base_path }}/static/css/tokens.css">
    <link rel="stylesheet" href="{{ base_path }}/static/css/app.css">
</head>
<body>
    <div class="login-wrapper">
        <form class="login-card" method="post" action="{{ base_path }}/login">
            <h1>evcc Dashboard</h1>
            {% if error %}
            <p class="login-error">Invalid password</p>
            {% endif %}
            <input type="password" name="password" placeholder="Password" autofocus required data-testid="login-password">
            <button type="submit" data-testid="login-submit">Sign In</button>
        </form>
    </div>
</body>
</html>
