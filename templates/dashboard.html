{% extends "base.html" %}

{% block title %}evcc Dashboard{% endblock %}

{% block content %}
<div class="dashboard" data-testid="dashboard">
    <!-- Hero Zone: Energy Flow Schematic -->
    <section class="dashboard__hero"
             id="schematic-container"
             hx-get="{{ base_path }}/partials/schematic"
             hx-trigger="every 2s"
             hx-swap="morph:idiomorph"
             aria-label="Energy flow overview"
             data-testid="hero-zone">
        {% include "partials/schematic.html" %}
    </section>

    <!-- Cards Zone: Detail Cards -->
    <section class="dashboard__cards"
             id="cards-container"
             hx-get="{{ base_path }}/partials/cards"
             hx-trigger="every 2s"
             hx-swap="morph:idiomorph"
             aria-label="Energy detail cards"
             data-testid="cards-zone-container">
        {% include "partials/cards.html" %}
    </section>

    <!-- Summary Zone: Today's Totals -->
    <section class="dashboard__summary"
             id="summary-container"
             hx-get="{{ base_path }}/partials/summary-new"
             hx-trigger="every 2s"
             hx-swap="morph:idiomorph"
             aria-label="Daily energy summary"
             data-testid="summary-zone-container">
        {% include "partials/summary_new.html" %}
    </section>
</div>
{% endblock %}
