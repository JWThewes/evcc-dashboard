<div class="energy-flow" aria-live="polite" data-testid="energy-flow-diagram">
  <!-- Horizontal layout (tablet/desktop >=640px) -->
  <svg class="energy-flow__svg-horizontal"
       viewBox="0 0 600 350"
       role="img"
       aria-label="{{ self.aria_description() }}"
       xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow-h" markerWidth="8" markerHeight="6" refX="4" refY="3" orient="auto" class="flow-arrow-marker">
        <path d="M0,0 L8,3 L0,6 Z" fill="currentColor"/>
      </marker>
    </defs>

    <!-- Flow Paths (behind nodes) -->
    <!-- PV -> Home -->
    {% if site.pv_flow_active() %}
    <path class="flow-path-active {{ self.pv_speed_class() }} flow-color-pv" d="M300,78 L300,147"/>
    {% else %}
    <path class="flow-path-idle" d="M300,78 L300,147"/>
    {% endif %}

    <!-- Grid -> Home (import) -->
    {% if site.grid_importing() %}
    <path class="flow-path-active {{ self.grid_speed_class() }} flow-color-grid-import" d="M108,175 L272,175"/>
    {% else %}
    <path class="flow-path-idle" d="M108,175 L272,175"/>
    {% endif %}

    <!-- Home -> Grid (export) -->
    {% if site.grid_exporting() %}
    <path class="flow-path-active {{ self.grid_speed_class() }} flow-color-grid-export" d="M272,175 L108,175"/>
    {% else %}
    {% if !site.grid_importing() %}
    <path class="flow-path-idle" d="M272,175 L108,175" style="display:none"/>
    {% endif %}
    {% endif %}

    <!-- Battery -> Home (discharging) -->
    {% if site.battery_discharging_flow() %}
    <path class="flow-path-active {{ self.battery_speed_class() }} flow-color-battery" d="M492,175 L328,175"/>
    {% else %}
    {% if !site.battery_charging_flow() %}
    <path class="flow-path-idle" d="M492,175 L328,175"/>
    {% endif %}
    {% endif %}

    <!-- Home -> Battery (charging) -->
    {% if site.battery_charging_flow() %}
    <path class="flow-path-active {{ self.battery_speed_class() }} flow-color-battery" d="M328,175 L492,175"/>
    {% else %}
    {% if !site.battery_discharging_flow() %}
    <path class="flow-path-idle" d="M328,175 L492,175"/>
    {% endif %}
    {% endif %}

    <!-- Home -> Car -->
    {% if loadpoint_charging %}
    <path class="flow-path-active {{ self.loadpoint_speed_class() }} flow-color-ev" d="M300,203 L300,272"/>
    {% else %}
    <path class="flow-path-idle" d="M300,203 L300,272"/>
    {% endif %}

    <!-- PV Node -->
    <g class="energy-flow__node" data-testid="energy-flow-node-pv">
      <circle class="energy-flow__node-circle node-color-pv" cx="300" cy="50" r="28"/>
      <g transform="translate(288,38)" class="energy-flow__node-icon--pv">
        <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <line x1="12" y1="2" x2="12" y2="5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="12" y1="19" x2="12" y2="22" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="4.22" y1="4.22" x2="6.34" y2="6.34" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="17.66" y1="17.66" x2="19.78" y2="19.78" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="2" y1="12" x2="5" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="19" y1="12" x2="22" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="4.22" y1="19.78" x2="6.34" y2="17.66" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="17.66" y1="6.34" x2="19.78" y2="4.22" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </g>
      <text class="energy-flow__node-value" x="300" y="95">{{ site.pv_power_kw() }}</text>
      <text class="energy-flow__node-label" x="300" y="110">PV Solar</text>
    </g>

    <!-- Home Node -->
    <g class="energy-flow__node" data-testid="energy-flow-node-home">
      <circle class="energy-flow__node-circle node-color-home" cx="300" cy="175" r="28"/>
      <g transform="translate(288,163)" class="energy-flow__node-icon--home">
        <path d="M3,12 L12,4 L21,12 V21 C21,21.55 20.55,22 20,22 H4 C3.45,22 3,21.55 3,21 Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" transform="scale(0.9) translate(1,1)"/>
      </g>
      <text class="energy-flow__node-value" x="300" y="220">{{ site.home_power_kw() }}</text>
      <text class="energy-flow__node-label" x="300" y="235">Home</text>
    </g>

    <!-- Grid Node -->
    <g class="energy-flow__node" data-testid="energy-flow-node-grid">
      <circle class="energy-flow__node-circle {% if site.grid_exporting() %}node-color-grid-export{% else %}node-color-grid-import{% endif %}" cx="80" cy="175" r="28"/>
      <g transform="translate(68,163)" class="{% if site.grid_exporting() %}energy-flow__node-icon--grid-export{% else %}energy-flow__node-icon--grid-import{% endif %}">
        <path d="M13,2 L3,14 H10 L11,22 L21,10 H14 Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" transform="scale(0.85) translate(2,2)"/>
      </g>
      <text class="energy-flow__node-value" x="80" y="220">{{ site.grid_power_kw() }}</text>
      <text class="energy-flow__node-sub" x="80" y="235">{{ site.grid_direction_label() }}</text>
    </g>

    <!-- Battery Node -->
    <g class="energy-flow__node" data-testid="energy-flow-node-battery">
      <circle class="energy-flow__node-circle node-color-battery" cx="520" cy="175" r="28"/>
      <g transform="translate(508,163)" class="energy-flow__node-icon--battery">
        <rect x="3" y="7" width="18" height="12" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <rect x="21" y="11" width="2" height="4" rx="0.5" fill="currentColor"/>
        <rect x="5" y="9" width="8" height="8" rx="0.5" fill="currentColor" opacity="0.3"/>
      </g>
      <text class="energy-flow__node-value" x="520" y="220">{{ site.battery_power_kw() }}</text>
      <text class="energy-flow__node-sub" x="520" y="235">{{ site.battery_soc_display() }}% · {{ site.battery_direction_label() }}</text>
    </g>

    <!-- Car Node -->
    <g class="energy-flow__node" data-testid="energy-flow-node-car">
      <circle class="energy-flow__node-circle node-color-ev" cx="300" cy="300" r="28"/>
      <g transform="translate(288,288)" class="energy-flow__node-icon--ev">
        <path d="M5,17 H19 L20,13 H18 L16,7 H8 L6,13 H4 Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" transform="scale(0.85) translate(2,2)"/>
        <circle cx="8" cy="19" r="1.5" fill="currentColor" transform="scale(0.85) translate(2,2)"/>
        <circle cx="16" cy="19" r="1.5" fill="currentColor" transform="scale(0.85) translate(2,2)"/>
      </g>
      <text class="energy-flow__node-value" x="300" y="345">{{ self.loadpoint_power_kw() }}</text>
      <text class="energy-flow__node-sub" x="300" y="335">{{ self.car_status_label() }}</text>
    </g>
  </svg>

  <!-- Vertical layout (phone <640px) -->
  <svg class="energy-flow__svg-vertical"
       viewBox="0 0 320 500"
       role="img"
       aria-label="{{ self.aria_description() }}"
       xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow-v" markerWidth="8" markerHeight="6" refX="4" refY="3" orient="auto" class="flow-arrow-marker">
        <path d="M0,0 L8,3 L0,6 Z" fill="currentColor"/>
      </marker>
    </defs>

    <!-- Flow Paths (vertical layout) -->
    <!-- PV -> Home -->
    {% if site.pv_flow_active() %}
    <path class="flow-path-active {{ self.pv_speed_class() }} flow-color-pv" d="M160,78 L160,142"/>
    {% else %}
    <path class="flow-path-idle" d="M160,78 L160,142"/>
    {% endif %}

    <!-- Home -> Grid -->
    {% if site.grid_importing() %}
    <path class="flow-path-active {{ self.grid_speed_class() }} flow-color-grid-import" d="M70,282 L132,198"/>
    {% else %}
    {% if site.grid_exporting() %}
    <path class="flow-path-active {{ self.grid_speed_class() }} flow-color-grid-export" d="M132,198 L70,282"/>
    {% else %}
    <path class="flow-path-idle" d="M132,198 L70,282"/>
    {% endif %}
    {% endif %}

    <!-- Home -> Battery -->
    {% if site.battery_discharging_flow() %}
    <path class="flow-path-active {{ self.battery_speed_class() }} flow-color-battery" d="M250,282 L188,198"/>
    {% else %}
    {% if site.battery_charging_flow() %}
    <path class="flow-path-active {{ self.battery_speed_class() }} flow-color-battery" d="M188,198 L250,282"/>
    {% else %}
    <path class="flow-path-idle" d="M188,198 L250,282"/>
    {% endif %}
    {% endif %}

    <!-- Home -> Car -->
    {% if loadpoint_charging %}
    <path class="flow-path-active {{ self.loadpoint_speed_class() }} flow-color-ev" d="M160,198 L160,412"/>
    {% else %}
    <path class="flow-path-idle" d="M160,198 L160,412"/>
    {% endif %}

    <!-- PV Node (vertical) -->
    <g class="energy-flow__node">
      <circle class="energy-flow__node-circle node-color-pv" cx="160" cy="50" r="24"/>
      <g transform="translate(150,40)" class="energy-flow__node-icon--pv">
        <circle cx="10" cy="10" r="3.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <line x1="10" y1="2" x2="10" y2="4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="10" y1="16" x2="10" y2="18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="3.5" y1="3.5" x2="5" y2="5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="15" y1="15" x2="16.5" y2="16.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="2" y1="10" x2="4" y2="10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="16" y1="10" x2="18" y2="10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </g>
      <text class="energy-flow__node-value" x="160" y="88">{{ site.pv_power_kw() }}</text>
      <text class="energy-flow__node-label" x="160" y="102">PV Solar</text>
    </g>

    <!-- Home Node (vertical) -->
    <g class="energy-flow__node">
      <circle class="energy-flow__node-circle node-color-home" cx="160" cy="170" r="24"/>
      <g transform="translate(150,160)" class="energy-flow__node-icon--home">
        <path d="M3,10 L10,4 L17,10 V17 C17,17.4 16.6,18 16,18 H4 C3.4,18 3,17.4 3,17 Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text class="energy-flow__node-value" x="160" y="208">{{ site.home_power_kw() }}</text>
      <text class="energy-flow__node-label" x="160" y="222">Home</text>
    </g>

    <!-- Grid Node (vertical) -->
    <g class="energy-flow__node">
      <circle class="energy-flow__node-circle {% if site.grid_exporting() %}node-color-grid-export{% else %}node-color-grid-import{% endif %}" cx="70" cy="310" r="24"/>
      <g transform="translate(60,300)" class="{% if site.grid_exporting() %}energy-flow__node-icon--grid-export{% else %}energy-flow__node-icon--grid-import{% endif %}">
        <path d="M10,2 L3,11 H8 L9,18 L16,9 H11 Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text class="energy-flow__node-value" x="70" y="348">{{ site.grid_power_kw() }}</text>
      <text class="energy-flow__node-sub" x="70" y="362">{{ site.grid_direction_label() }}</text>
    </g>

    <!-- Battery Node (vertical) -->
    <g class="energy-flow__node">
      <circle class="energy-flow__node-circle node-color-battery" cx="250" cy="310" r="24"/>
      <g transform="translate(240,300)" class="energy-flow__node-icon--battery">
        <rect x="3" y="6" width="14" height="10" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <rect x="17" y="9" width="2" height="4" rx="0.5" fill="currentColor"/>
      </g>
      <text class="energy-flow__node-value" x="250" y="348">{{ site.battery_power_kw() }}</text>
      <text class="energy-flow__node-sub" x="250" y="362">{{ site.battery_soc_display() }}%</text>
    </g>

    <!-- Car Node (vertical) -->
    <g class="energy-flow__node">
      <circle class="energy-flow__node-circle node-color-ev" cx="160" cy="440" r="24"/>
      <g transform="translate(150,430)" class="energy-flow__node-icon--ev">
        <path d="M4,14 H16 L17,11 H15 L13,6 H7 L5,11 H3 Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="7" cy="15.5" r="1.2" fill="currentColor"/>
        <circle cx="13" cy="15.5" r="1.2" fill="currentColor"/>
      </g>
      <text class="energy-flow__node-value" x="160" y="478">{{ self.loadpoint_power_kw() }}</text>
      <text class="energy-flow__node-sub" x="160" y="492">{{ self.car_status_label() }}</text>
    </g>
  </svg>
</div>
