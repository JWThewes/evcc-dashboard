<div class="ef-container" data-testid="energy-flow-container"
     hx-get="{{ base_path }}/partials/energy-flow-svg"
     hx-trigger="every 3s"
     hx-swap="none"
     aria-label="Energy flow visualization"
     role="img">

  <!-- Self-sufficiency hero metric -->
  <div class="ef-hero" data-testid="energy-flow-hero">
    <span class="ef-hero-value" id="ef-self-sufficiency" data-testid="ef-self-sufficiency">{{ state.self_sufficiency_display() }}</span>
    <span class="ef-hero-unit">%</span>
    <span class="ef-hero-label">Self-Sufficiency</span>
  </div>

  <svg class="ef-svg" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg"
       aria-hidden="true" data-testid="energy-flow-svg">

    <!-- Flow path definitions -->
    <defs>
      <path id="ef-path-pv" d="M 100,80 C 200,80 250,200 300,200" fill="none"/>
      <path id="ef-path-grid" d="M 60,200 C 130,200 200,200 300,200" fill="none"/>
      <path id="ef-path-battery" d="M 100,320 C 200,320 250,200 300,200" fill="none"/>
      <path id="ef-path-ev" d="M 300,200 C 400,200 450,200 540,200" fill="none"/>
    </defs>

    <!-- Path stroke lines -->
    <use href="#ef-path-pv" class="ef-path-line ef-path-line--pv {{ state.pv_path.direction.css_class() }}" stroke-width="2"/>
    <use href="#ef-path-grid" class="ef-path-line ef-path-line--grid {{ state.grid_path.direction.css_class() }}" stroke-width="2"/>
    <use href="#ef-path-battery" class="ef-path-line ef-path-line--battery {{ state.battery_path.direction.css_class() }}{% if !state.has_battery %} ef-hidden{% endif %}" stroke-width="2"/>
    <use href="#ef-path-ev" class="ef-path-line ef-path-line--ev {{ state.ev_path.direction.css_class() }}{% if !state.has_ev %} ef-hidden{% endif %}" stroke-width="2"/>

    <!-- Particles: PV path (always forward) -->
    {% if state.pv_path.active %}
    <circle class="ef-particle ef-particle--pv ef-particle--1" r="4" data-path="pv" data-power="{{ state.pv_path.power_display() }}">
      <animateMotion dur="{{ state.pv_path.duration_ms }}ms" repeatCount="indefinite"><mpath href="#ef-path-pv"/></animateMotion>
    </circle>
    <circle class="ef-particle ef-particle--pv ef-particle--2" r="3" data-path="pv">
      <animateMotion dur="{{ state.pv_path.duration_ms }}ms" repeatCount="indefinite" begin="{{ state.pv_path.duration_ms / 3 }}ms"><mpath href="#ef-path-pv"/></animateMotion>
    </circle>
    <circle class="ef-particle ef-particle--pv ef-particle--3" r="3" data-path="pv">
      <animateMotion dur="{{ state.pv_path.duration_ms }}ms" repeatCount="indefinite" begin="{{ state.pv_path.duration_ms * 2 / 3 }}ms"><mpath href="#ef-path-pv"/></animateMotion>
    </circle>
    {% endif %}

    <!-- Particles: Grid path (bidirectional) -->
    {% if state.grid_path.active %}
    <circle class="ef-particle ef-particle--grid ef-particle--1" r="4" data-path="grid" data-power="{{ state.grid_path.power_display() }}">
      <animateMotion dur="{{ state.grid_path.duration_ms }}ms" repeatCount="indefinite"{% if state.grid_path.is_reverse() %} keyPoints="1;0" keyTimes="0;1"{% endif %}><mpath href="#ef-path-grid"/></animateMotion>
    </circle>
    <circle class="ef-particle ef-particle--grid ef-particle--2" r="3" data-path="grid">
      <animateMotion dur="{{ state.grid_path.duration_ms }}ms" repeatCount="indefinite" begin="{{ state.grid_path.duration_ms / 3 }}ms"{% if state.grid_path.is_reverse() %} keyPoints="1;0" keyTimes="0;1"{% endif %}><mpath href="#ef-path-grid"/></animateMotion>
    </circle>
    {% endif %}

    <!-- Particles: Battery path (bidirectional) -->
    {% if state.battery_path.active && state.has_battery %}
    <circle class="ef-particle ef-particle--battery ef-particle--1" r="4" data-path="battery" data-power="{{ state.battery_path.power_display() }}">
      <animateMotion dur="{{ state.battery_path.duration_ms }}ms" repeatCount="indefinite"{% if state.battery_path.is_reverse() %} keyPoints="1;0" keyTimes="0;1"{% endif %}><mpath href="#ef-path-battery"/></animateMotion>
    </circle>
    <circle class="ef-particle ef-particle--battery ef-particle--2" r="3" data-path="battery">
      <animateMotion dur="{{ state.battery_path.duration_ms }}ms" repeatCount="indefinite" begin="{{ state.battery_path.duration_ms / 2 }}ms"{% if state.battery_path.is_reverse() %} keyPoints="1;0" keyTimes="0;1"{% endif %}><mpath href="#ef-path-battery"/></animateMotion>
    </circle>
    {% endif %}

    <!-- Particles: EV path (always forward) -->
    {% if state.ev_path.active && state.has_ev %}
    <circle class="ef-particle ef-particle--ev ef-particle--1" r="4" data-path="ev" data-power="{{ state.ev_path.power_display() }}">
      <animateMotion dur="{{ state.ev_path.duration_ms }}ms" repeatCount="indefinite"><mpath href="#ef-path-ev"/></animateMotion>
    </circle>
    <circle class="ef-particle ef-particle--ev ef-particle--2" r="3" data-path="ev">
      <animateMotion dur="{{ state.ev_path.duration_ms }}ms" repeatCount="indefinite" begin="{{ state.ev_path.duration_ms / 2 }}ms"><mpath href="#ef-path-ev"/></animateMotion>
    </circle>
    {% endif %}

    <!-- Static arrows for prefers-reduced-motion -->
    {% if state.pv_path.active %}
    <polygon class="ef-arrow ef-arrow--pv" points="280,195 290,200 280,205"/>
    {% endif %}
    {% if state.grid_path.active %}
    <polygon class="ef-arrow ef-arrow--grid{% if state.grid_path.is_reverse() %} ef-arrow--reverse{% endif %}" points="270,195 280,200 270,205"/>
    {% endif %}
    {% if state.battery_path.active && state.has_battery %}
    <polygon class="ef-arrow ef-arrow--battery{% if state.battery_path.is_reverse() %} ef-arrow--reverse{% endif %}" points="280,295 290,300 280,305"/>
    {% endif %}
    {% if state.ev_path.active && state.has_ev %}
    <polygon class="ef-arrow ef-arrow--ev" points="400,195 410,200 400,205"/>
    {% endif %}

    <!-- Node: PV (top-left) -->
    <g class="ef-node ef-node--pv" transform="translate(60, 50)" data-testid="ef-node-pv">
      <circle r="32" class="ef-node-bg"/>
      <svg x="-12" y="-12" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
      </svg>
      <foreignObject x="-30" y="36" width="60" height="24">
        <span xmlns="http://www.w3.org/1999/xhtml" class="ef-node-label" id="ef-pv-power" hx-swap-oob="true" data-testid="ef-pv-power">{{ state.pv_power_display() }} W</span>
      </foreignObject>
    </g>

    <!-- Node: Grid (left) -->
    <g class="ef-node ef-node--grid" transform="translate(30, 200)" data-testid="ef-node-grid">
      <circle r="32" class="ef-node-bg"/>
      <svg x="-12" y="-12" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/>
      </svg>
      <foreignObject x="-30" y="36" width="60" height="24">
        <span xmlns="http://www.w3.org/1999/xhtml" class="ef-node-label" id="ef-grid-power" hx-swap-oob="true" data-testid="ef-grid-power">{{ state.grid_power_abs_display() }} W</span>
      </foreignObject>
    </g>

    <!-- Node: Home (center) -->
    <g class="ef-node ef-node--home" transform="translate(300, 200)" data-testid="ef-node-home">
      <circle r="38" class="ef-node-bg ef-node-bg--home"/>
      <svg x="-12" y="-12" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <foreignObject x="-30" y="42" width="60" height="24">
        <span xmlns="http://www.w3.org/1999/xhtml" class="ef-node-label" id="ef-home-power" hx-swap-oob="true" data-testid="ef-home-power">{{ state.home_power_display() }} W</span>
      </foreignObject>
    </g>

    <!-- Node: Battery (bottom-left) -->
    {% if state.has_battery %}
    <g class="ef-node ef-node--battery" transform="translate(60, 340)" data-testid="ef-node-battery">
      <circle r="32" class="ef-node-bg"/>
      <svg x="-12" y="-12" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="1" y="6" width="18" height="12" rx="2"/><line x1="23" y1="10" x2="23" y2="14"/>
      </svg>
      <foreignObject x="-30" y="36" width="60" height="24">
        <span xmlns="http://www.w3.org/1999/xhtml" class="ef-node-label" id="ef-battery-power" hx-swap-oob="true" data-testid="ef-battery-power">{{ state.battery_power_abs_display() }} W</span>
      </foreignObject>
    </g>
    {% endif %}

    <!-- Node: EV (right) -->
    {% if state.has_ev %}
    <g class="ef-node ef-node--ev" transform="translate(540, 200)" data-testid="ef-node-ev">
      <circle r="32" class="ef-node-bg"/>
      <svg x="-12" y="-12" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="13,2 3,14 12,14 11,22 21,10 12,10 13,2"/>
      </svg>
      <foreignObject x="-30" y="36" width="60" height="24">
        <span xmlns="http://www.w3.org/1999/xhtml" class="ef-node-label" id="ef-ev-power" hx-swap-oob="true" data-testid="ef-ev-power">{{ state.ev_power_display() }} W</span>
      </foreignObject>
    </g>
    {% endif %}
  </svg>
</div>
