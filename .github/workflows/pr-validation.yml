name: PR Validation

on:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test --all-targets

      - name: Asset budget check
        run: |
          echo "Checking individual file budgets (max 4096 bytes each)..."
          for file in static/css/tokens.css static/css/shell.css static/js/theme.js; do
            if [ -f "$file" ]; then
              size=$(wc -c < "$file")
              if [ "$size" -gt 4096 ]; then
                echo "FAIL: $file is $size bytes (budget: 4096)"
                exit 1
              fi
              echo "  OK: $file = $size bytes"
            fi
          done

          echo "Checking aggregate budget (max 16384 bytes)..."
          total=0
          for file in static/css/tokens.css static/css/shell.css static/js/theme.js; do
            if [ -f "$file" ]; then
              size=$(wc -c < "$file")
              total=$((total + size))
            fi
          done
          if [ "$total" -gt 16384 ]; then
            echo "FAIL: Total new assets = $total bytes (budget: 16384)"
            exit 1
          fi
          echo "  OK: Total = $total bytes"

      - name: No external requests check
        run: |
          echo "Checking for external font/CDN references..."
          if grep -r "fonts.googleapis.com\|fonts.gstatic.com" templates/; then
            echo "FAIL: External font references found in templates"
            exit 1
          fi
          echo "  OK: No external font references"
